[project]
name = "youtube-shorts-assistant"
version = "0.23.0"
description = "LangGraph YouTube Shorts concept assistant (ADK experiment archived)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.0",
  "langchain-google-genai>=2.0.0",
  "langchain-core>=0.3.0",
  "python-dotenv>=1.0.0",
  "pydantic-settings>=2.0.0",
  "aiosqlite>=0.20.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.1.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "mcp>=1.9.0,<2",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.8.0",
  "pyright>=1.1.390",
  "pip-audit>=2.7.0",
  "PyYAML>=6.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "llm: calls a real LLM; excluded from default CI via -m 'not llm'",
  "a2a: needs local Research A2A server; excluded via -m 'not a2a'",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# FastAPI Depends() in defaults is the framework idiom.
"src/shorts_assistant/api/app.py" = ["B008"]
