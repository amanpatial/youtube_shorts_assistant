[project]
name = "youtube-shorts-assistant"
version = "0.1.0"
description = "LangGraph YouTube Shorts concept assistant (ADK experiment archived)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.0",
  "langchain-google-genai>=2.0.0",
  "langchain-core>=0.3.0",
  "python-dotenv>=1.0.0",
  "pydantic-settings>=2.0.0",
  "aiosqlite>=0.20.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.1.0",
  "langgraph-checkpoint-postgres>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "llm: calls a real LLM; excluded from default CI via -m 'not llm'",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
